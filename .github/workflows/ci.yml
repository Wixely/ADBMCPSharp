name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate scripts on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\validate-powershell.ps1 -RequireWindowsPowerShell
      - run: dotnet restore ADBMCPSharp.slnx
      - run: dotnet build ADBMCPSharp.slnx --configuration Release --no-restore
      - run: dotnet test ADBMCPSharp.slnx --configuration Release --no-build --results-directory TestResults --report-xunit-trx --report-xunit-trx-filename ADBMCPSharp.Tests.trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 3

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and smoke-test container
        shell: pwsh
        run: ./scripts/docker-smoke-test.ps1
      - name: Smoke-test remote ADB container topology
        shell: pwsh
        run: ./scripts/docker-remote-topology-test.ps1 -SkipBuild

  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build release archive
        shell: pwsh
        run: ./scripts/package-release.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.tar.gz
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
